<svg 
    width = "350"
    viewBox = "-600 -100 1800 1000"
    xmlns = "http://www.w3.org/2000/svg"
>
    <g>
        <g>
            <rect 
                width="700" 
                height="500" 
                rx="20" 
                ry="20" 
                fill = "#6B7C98"
                fill-opacity = "0.3"
                stroke = "black"
                stroke-width = "10"
            />

            <path d="M 5 5 L 340 300 Q 350 310 360 300 L 695 5"
            style=
                "fill:none;
                stroke:black;
                stroke-width:10"
            />
        </g>

        <path d="
            M -500 50 Q -450 25 -400 50 Q -350 75 -300 50 Q -250 25 -200 50 Q -150 75 -100 50
            M -500 250 Q -450 225 -400 250 Q -350 275 -300 250 Q -250 225 -200 250 Q -150 275 -100 250
            M -500 450 Q -450 425 -400 450 Q -350 475 -300 450 Q -250 425 -200 450 Q -150 475 -100 450
        "
        style=
            "fill:none;
            stroke:black;
            stroke-width:10"
        />

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="translate"
            values="0 0; 0 -10; 0 40; 0 50; 0 40; 0 -10; 0 0"
            dur="2s"
            repeatCount="indefinite"/>
    </g>
</svg>